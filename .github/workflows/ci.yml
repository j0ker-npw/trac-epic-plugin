name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python (>=3.9,<3.12) and the classifiers in
        # pyproject.toml. Trac 1.6 officially supports Python up to 3.11.
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the plugin and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run the Python test suite
        run: python -m pytest tests/ -v

  python-tests-experimental:
    name: Python ${{ matrix.python-version }} (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true  # Do not block CI if these versions fail
    strategy:
      fail-fast: false
      matrix:
        # Experimental: Python 3.12 and 3.13 are not yet officially supported
        # by upstream Trac 1.6, but Trac already declares multipart as a
        # dependency for Python >= 3.13 (replacement for the removed cgi module).
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the plugin and test tooling
        run: |
          python -m pip install --upgrade pip
          # setuptools (and its pkg_resources) is not pre-installed on Python 3.12+
          # GHA runners; install it explicitly before Trac which imports pkg_resources.
          pip install setuptools
          # multipart replaces the removed cgi module on Python >= 3.13.
          pip install multipart
          # --ignore-requires-python: pyproject.toml caps at <3.12 because Trac 1.6
          # does not officially support newer versions; we bypass it for experiments.
          pip install --ignore-requires-python -e .
          pip install pytest

      - name: Run the Python test suite
        run: python -m pytest tests/ -v

  js-tests:
    name: JavaScript logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run the epic.js logic tests
        run: node tests/test_epic_js.js
