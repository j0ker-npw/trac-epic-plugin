# Babel extraction configuration for TracEpicPlugin
[python: **.py]
encoding = utf-8

# Trac 1.6 configures its Jinja2 environment with custom delimiters:
# variables use ``${ ... }`` and line statements/comments use ``#`` / ``##``.
# The extractor must mirror that config, otherwise ``${ _('...') }`` calls in
# templates are not parsed and stay out of the catalog.
[jinja2: **/templates/**.html]
encoding = utf-8
variable_start_string = ${
variable_end_string = }
line_statement_prefix = #
line_comment_prefix = ##
